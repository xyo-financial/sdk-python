name: Regenerate Python OpenAPI Client

on:
  repository_dispatch:
    # specs only ever emits spec_tagged; see xyo-financial/specs#12
    types: [spec_tagged]
  workflow_dispatch:
    inputs:
      spec_tag:
        description: 'Tag or branch in xyo-financial/specs to generate from'
        required: false
        default: 'main'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4

      - name: Checkout OpenAPI specification
        uses: actions/checkout@v4
        with:
          repository: xyo-financial/specs
          ref: ${{ github.event.client_payload.tag || inputs.spec_tag || 'main' }}
          path: specs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate OpenAPI Python client
        run: |
          # -o is the root the package tree is written under, not the package directory
          # itself: packageName=xyo._generated makes the generator append xyo/_generated/
          # to it. Pointing -o at src/xyo/_generated therefore produced a nested
          # src/xyo/_generated/xyo/_generated/ that nothing imported, so regeneration
          # silently never updated the real package and the layer went stale.
          npx -y @openapitools/openapi-generator-cli generate \
            -i specs/openapi.yml \
            -g python \
            -o src \
            --additional-properties=packageName=xyo._generated,library=httpx,generateSourceCodeOnly=true \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

          # Fail loudly rather than open a plausible-looking pull request if the output
          # ever lands somewhere unexpected again.
          if [ ! -f src/xyo/_generated/api/enrichment_api.py ]; then
            echo "::error::Generated client missing at src/xyo/_generated/api/enrichment_api.py"
            exit 1
          fi
          if [ -e src/xyo/_generated/xyo ]; then
            echo "::error::Generator nested its output at src/xyo/_generated/xyo; check -o against packageName"
            exit 1
          fi

          # Clean up specs checkout
          rm -rf specs

      - name: Install dependencies & run tests
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pytest

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate OpenAPI client from spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}"
          title: "Automated SDK Update"
          body: "This PR automatically updates the generated Python client based on OpenAPI spec ${{ github.event.client_payload.tag || inputs.spec_tag || 'latest' }}."
          branch: "chore/auto-update-sdk"
          delete-branch: true
